version: '3.8'

services:
  newsbias-api:
    build: .
    container_name: newsbias_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENABLE_INGESTION_DAEMON=true
      - INGESTION_INTERVAL_SECONDS=1800
      - INGESTION_INITIAL_DELAY=10
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/model"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

